  dt_redmond:   { name: "Downtown Redmond Station", short: "Downtown Redmond", lat: 47.67170, lon: -122.11850 },

  startId: "here", // usual starting point: "here" = current location, a library id, or null = minutes by hand

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
const todayKey = () => { const d = new Date(); return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate(); };
const FIRST_RUN = store.get("startnow.settings", null) === null;
function loadSettings() {
  const s = store.get("startnow.settings", {}) || {};
  return Object.assign({}, DEFAULTS, s, {
    drive: Object.assign({}, DEFAULTS.drive, s.drive || {}),
    park: Object.assign({}, DEFAULTS.park, s.park || {}),
    walkAdj: Object.assign({}, s.walkAdj || {}),
    links: Array.isArray(s.links) ? s.links : []
  });
}
// Library: places and starting points you've entered. Kept when you "Start over", so you can pick them again.
function loadLib() {
  const l = store.get("startnow.library", null) || {};
  const lib = { places: Array.isArray(l.places) ? l.places : [], starts: Array.isArray(l.starts) ? l.starts : [], here: l.here && l.here.drive ? l.here : null };
  const old = (store.get("startnow.settings", {}) || {}).places;   // older versions kept places in settings
  if (Array.isArray(old)) old.forEach(p => { if (!lib.places.some(x => x.id === p.id)) lib.places.push(p); });
  return lib;
}
function loadToday() { const t = store.get("startnow.today", null); return t && t.date === todayKey() ? t : { date: todayKey() }; }
let S = loadSettings();
let LIB = loadLib();

let T = loadToday();          // "today only" changes, reset automatically tomorrow
const saveS = () => store.set("startnow.settings", S);
const saveT = () => store.set("startnow.today", T);
const eff = k => (T[k] !== undefined && T[k] !== null ? T[k] : S[k]);

/* ================= helpers ================= */
const $ = id => document.getElementById(id);
const esc = x => String(x).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const hm = s => { const [h, m] = String(s).split(":").map(Number); return h * 60 + m; };
const hmStr = m => { m = ((m % 1440) + 1440) % 1440; return String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0"); };
function fmt(m) {
  m = ((Math.round(m) % 1440) + 1440) % 1440;
  let h = Math.floor(m / 60); const ap = h >= 12 ? "PM" : "AM"; h = h % 12 || 12;
  return h + ":" + String(m % 60).padStart(2, "0") + " " + ap;
}
const nowMin = () => { const d = new Date(); return d.getHours() * 60 + d.getMinutes() + d.getSeconds() / 60; };

const cap = s => s[0].toUpperCase() + s.slice(1);
const routeLabel = r => /^\d+$/.test(r) ? "Bus " + r : r;
function dist(a, b) {
  const R = 6371000, r = Math.PI / 180;
  const dLa = (b.lat - a.lat) * r, dLo = (b.lon - a.lon) * r;
  const h = Math.sin(dLa / 2) ** 2 + Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin(dLo / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));

// STOPS: id -> {name, lat, lon, dirs:Set}
const STOPS = (() => {
  const out = {};

    out[id] = { id, name: name.replace(/^Sr /, "SR ").replace(/ Bay (\d+) - Bay \1$/, " - Bay $1").replace(" Park And Ride", " P&R"), lat, lon, dirs: new Set() };
  for (const days of Object.values(SCHED.routes || {}))
    for (const dirs of Object.values(days))
      for (const [dir, block] of Object.entries(dirs)) block.s.forEach(id => out[id] && out[id].dirs.add(dir));

})();

const legCache = new Map();
function legs(dir, fromSet, toId) {
  const ck = dir + "|" + dayType() + "|" + [...fromSet].join(",") + "|" + toId;
  if (legCache.has(ck)) return legCache.get(ck);
  const out = [];
  for (const [route, days] of Object.entries(SCHED.routes || {})) {
    const block = (days[dayType()] || {})[dir];
    if (!block) continue;
    const ti = block.s.indexOf(toId);
    if (ti < 0) continue;
    const fis = block.s.map((id, i) => fromSet.has(id) ? i : -1).filter(i => i >= 0);
    if (!fis.length) continue;
    for (const row of block.t) {
      const arr = row[ti]; if (arr == null) continue;
      let best = null;
      for (const fi of fis) if (row[fi] != null && row[fi] < arr && (!best || row[fi] < best.dep)) best = { dep: row[fi], from: block.s[fi] };
      if (best) out.push({ dep: best.dep, arr, route, from: best.from, to: toId });
    }
  }
  out.sort((a, b) => a.dep - b.dep || a.arr - b.arr);

}

let hereState = "idle";   // idle | finding | ok | off
const currentStart = () => {

      if (!LIB.here || dist(LIB.here, geo) > 200 || manual) {

    hereState = "off"; render(); done();
    if (manual) locationHelp(err.code === 1 ? "denied" : err.code === 3 ? "timeout" : "unavailable", `code ${err.code}${err.message ? ": " + err.message : ""}`);

}
function hereNote() {
  if (eff("startId") !== "here") return "";

  if (hereState === "off") return LIB.here ? "Location off · last known spot" : "Location off · using ⚙︎ minutes";

}

  return base + (T.traffic || 0);

  if (!list.length) return [];
  const near = list.filter(x => x.w <= Math.max(list[0].w + 8, 12) && x.w <= 25).slice(0, 8);
  const adj = S.walkAdj[place.id] || 0;
  if (near.length) return near.map(x => ({ id: x.st.id, walk: Math.max(0, x.w + adj), far: false }));
  return list.slice(0, 3).map(x => ({ id: x.st.id, walk: Math.max(0, rideGuess(x.st, place) + adj), far: true }));

const stopName = id => (STOPS[id] || {}).name || "?";

/* ================= planning ================= */

        const arrive = t.arr + c.walk;

          leave: t.dep - S.park[h] - S.buffer - driveMin(h), ok: arrive <= target - S.cushion });

function plan() {
  const m = mode();

  if (pin && pin.dest === eff("dest")) {

      { t: trip.dep, lbl: `${lbl} leaves in`, what: `${stopName(trip.from)} → ${stopName(trip.to)}` },
      { t: trip.arrive, lbl: `Arrive ${name} in`, what: `Off at ${stopName(trip.to)}, ${last}` }

      { t: trip.leave, lbl: "Leave in", what: `${trip.far ? "About" : "🚶"} ${trip.walk} min → ${stopName(trip.from)}` },
      { t: trip.dep, lbl: `${lbl} leaves in`, what: `${stopName(trip.from)} → ${hub.short}` },
      { t: trip.arr, lbl: `Off at ${hub.short} in`, what: `${bayOf(trip.to)} · walk to car` },

/* ================= no transit left: drive instead ================= */
const driveCache = {};
function directDrive(from, to) {

  if (k in driveCache) return driveCache[k];
  driveCache[k] = null;
  fetch(`https://router.project-osrm.org/route/v1/driving/${from.lon},${from.lat};${to.lon},${to.lat}?overview=false`)
    .then(r => r.json()).then(j => { driveCache[k] = Math.ceil(j.routes[0].duration / 60 * 1.15); tick(); }).catch(() => {});

    chip.textContent = `🚗 Drive instead${mins ? " · ~" + mins + " min" : ""}${P.m === "ret" ? " to " + P.hub.short : ""}`;

/* ================= map + step-by-step ================= */
function decodePolyline(str) {
  let i = 0, lat = 0, lon = 0; const out = [];
  while (i < str.length) {
    for (let k = 0; k < 2; k++) {
      let b, shift = 0, res = 0;
      do { b = str.charCodeAt(i++) - 63; res |= (b & 31) << shift; shift += 5; } while (b >= 32);
      const d = (res & 1) ? ~(res >> 1) : (res >> 1);
      if (k === 0) lat += d; else lon += d;
    }
    out.push([lat / 1e5, lon / 1e5]);
  }
  return out;
}
const ll = st => [st.lat, st.lon];
// The vehicle's path between two stops: the route shape if we have it, else straight lines through the stops.
function ridePath(route, dir, fromId, toId) {
  const a = STOPS[fromId], b = STOPS[toId];
  const enc = ((SCHED.shapes || {})[route] || {})[dir];
  if (enc) {
    const pts = decodePolyline(enc);
    const near = st => { let bi = 0, bd = Infinity; pts.forEach((p, i) => { const d = dist(st, { lat: p[0], lon: p[1] }); if (d < bd) { bd = d; bi = i; } }); return [bi, bd]; };
    const [i1, d1] = near(a), [i2, d2] = near(b);
    if (i1 < i2 && d1 < 400 && d2 < 400) return [ll(a), ...pts.slice(i1, i2 + 1), ll(b)];
  }
  const block = ((SCHED.routes[route] || {})[dayType()] || {})[dir];
  if (block) {
    const i1 = block.s.indexOf(fromId), i2 = block.s.indexOf(toId);
    if (i1 >= 0 && i2 > i1) return block.s.slice(i1, i2 + 1).map(id => ll(STOPS[id]));
  }
  return [ll(a), ll(b)];
}

function timeline() {
  const { m, trip: t, hub, hubId, name } = P;
  const ride = t.arr - t.dep, lbl = routeLabel(t.route);

  const li = (cls, tm, title, sub, soft) =>
    `<li class="${cls}"><span class="tm ${soft ? "soft" : ""}">${tm}</span><span class="dot"></span><span class="tx"><b>${esc(title)}</b>${sub ? `<span>${esc(sub)}</span>` : ""}</span></li>`;
  const rows = m === "out" ? [
    li("drive", fmt(t.leave), eff("startId") === "here" ? "Leave from where you are" : "Leave " + startName(), `Drive ${driveMin(hubId)} min to ${hub.short}`),
    li("walk", fmt(t.dep - S.park[hubId] - S.buffer), `Park at ${hub.name}`, `Walk ${S.park[hubId]} min, be there ${S.buffer} min early`),
    li("ride", fmt(t.dep), `${lbl} from ${stopName(t.from)}`, `${ride} min ride`),
    li("walk", fmt(t.arr), `Get off at ${stopName(t.to)}`, lastLeg),
    li("end", fmt(t.arrive), `Arrive ${name}`, t.ok ? `${hm(eff("arriveBy")) - t.arrive} min to spare` : `Late for ${fmt(hm(eff("arriveBy")))}`)
  ] : [
    li("walk", fmt(t.leave), `Leave ${name}`, t.far ? `About ${t.walk} min to the stop` : `Walk ${t.walk} min to the stop`),
    li("ride", fmt(t.dep), `${lbl} from ${stopName(t.from)}`, `${ride} min ride`),
    li("walk", fmt(t.arr), `Get off at ${stopName(t.to)}`, `Walk ${S.carWalk} min to your car`),
    li("drive", fmt(t.arr + S.carWalk), `Drive from ${hub.name}`, `${driveMin(hubId)} min`),
    li("end", fmt(t.home), "Home", "")
  ];
  return rows.join("");
}

function drawMap() {
  const el = $("map"); if (!el || !P.trip) return;
  if (mapObj) { mapObj.remove(); mapObj = null; }
  el.textContent = "";
  const { m, trip: t, hub, place, name } = P;
  const color = (SCHED.colors || {})[t.route] || "#3b82f6";
  const dark = matchMedia("(prefers-color-scheme: dark)").matches;
  const map = mapObj = L.map(el, { zoomControl: false, attributionControl: true });
  map.attributionControl.setPrefix(false);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",
    { maxZoom: 19, className: dark ? "tiles-dark" : "", attribution: '© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>' }).addTo(map);
  const walkStyle = { color: dark ? "#cbd5e1" : "#475569", weight: 4, dashArray: "1 8", lineCap: "round" };
  const a = STOPS[t.from], b = STOPS[t.to];
  const hubLL = [hub.lat, hub.lon], placeLL = [place.lat, place.lon];
  const ride = ridePath(t.route, m, t.from, t.to);
  const all = [...ride];
  L.polyline(ride, { color: "#fff", weight: 9, opacity: dark ? .15 : .9 }).addTo(map);
  L.polyline(ride, { color, weight: 5 }).addTo(map);
  if (m === "out") {
    L.polyline([hubLL, ll(a)], walkStyle).addTo(map);
    L.polyline([ll(b), placeLL], walkStyle).addTo(map);
  } else {
    L.polyline([placeLL, ll(a)], walkStyle).addTo(map);
    L.polyline([ll(b), hubLL], walkStyle).addTo(map);
  }
  all.push(hubLL, placeLL);
  const pin = (latlng, bg, label) => L.marker(latlng, { icon: L.divIcon({ className: "", html: `<div class="pin" style="background:${bg}"></div>`, iconSize: [14, 14], iconAnchor: [7, 7] }) })
    .addTo(map).bindTooltip(label, { permanent: true, direction: "top", className: "lbl", offset: [0, -8] });
  const stopDot = (st, label) => L.circleMarker(ll(st), { radius: 5, color, weight: 3, fillColor: "#fff", fillOpacity: 1 }).addTo(map).bindTooltip(label);
  stopDot(a, `${routeLabel(t.route)} · ${stopName(t.from)} · ${fmt(t.dep)}`);
  stopDot(b, `${stopName(t.to)} · ${fmt(t.arr)}`);
  pin(hubLL, "#0f172a", m === "out" ? `Park · ${hub.short}` : `Car · ${hub.short}`);
  pin(placeLL, color, name);
  const fit = () => map.fitBounds(L.latLngBounds(all), { padding: [40, 40] });
  fit();
  setTimeout(() => { map.invalidateSize(); fit(); }, 320);
}

/* ================= location → drive times ================= */
async function drivesFrom(la, lo) {
  const out = {};
  await Promise.all(Object.entries(HUBS).map(async ([id, h]) => {
    const j = await (await fetch(`https://router.project-osrm.org/route/v1/driving/${lo},${la};${h.lon},${h.lat}?overview=false`)).json();
    out[id] = Math.max(1, Math.ceil(j.routes[0].duration / 60 * 1.15)); // small allowance for traffic
  }));
  return out;
}
let pendingDrives = null;   // what to do with drive times once we get them (for "Try again" / typed address)
function measureDrives(onDone) {
  pendingDrives = onDone;
  if (!navigator.geolocation || !window.isSecureContext) { locationHelp("unavailable"); return; }
  toast("Finding you…");
  const ok = async pos => {
    const geo = { lat: pos.coords.latitude, lon: pos.coords.longitude };
    try { onDone(await drivesFrom(geo.lat, geo.lon), geo, await nearbyLabel(geo)); }
    catch (e) { toast("Got your location, but couldn't get drive times. Check your connection."); }
  };
  const fail = err => locationHelp(err.code === 1 ? "denied" : err.code === 3 ? "timeout" : "unavailable",
    `code ${err.code}${err.message ? ": " + err.message : ""}`);
  // Quick, low-power try first; if the phone can't place you, try once more with GPS.
  navigator.geolocation.getCurrentPosition(ok, err => {
    if (err.code === 1) return fail(err);
    navigator.geolocation.getCurrentPosition(ok, fail, { enableHighAccuracy: true, timeout: 30000, maximumAge: 0 });
  }, { enableHighAccuracy: false, timeout: 15000, maximumAge: 10 * 60 * 1000 });
}
// Short street name for a location, e.g. "NE 85th St, Redmond" (asks OpenStreetMap once).
async function nearbyLabel(geo) {
  try {
    const j = await (await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=17&lat=${geo.lat}&lon=${geo.lon}`, { headers: { "Accept-Language": "en" } })).json();
    const a = j.address || {};
    const street = [a.house_number, a.road].filter(Boolean).join(" ");
    const town = a.city || a.town || a.village || a.suburb || "";
    return [street, town].filter(Boolean).join(", ") || null;
  } catch (e) { return null; }
}
const shortAddr = t => t && t.replace(/\bNortheast\b/g, "NE").replace(/\bNorthwest\b/g, "NW").replace(/\bSoutheast\b/g, "SE").replace(/\bSouthwest\b/g, "SW")
  .replace(/\bStreet\b/g, "St").replace(/\bAvenue\b/g, "Ave").replace(/\bPlace\b/g, "Pl").replace(/\bDrive\b/g, "Dr").replace(/\bRoad\b/g, "Rd").replace(/\bBoulevard\b/g, "Blvd").replace(/\bCourt\b/g, "Ct").replace(/\bWay\b(?=,|$)/g, "Way");
// Save (or refresh) a starting point in the library. Points within 150 m of a saved one update it.
function saveStart(drive, geo, name) {
  let st = geo ? LIB.starts.find(x => x.lat != null && dist(x, geo) < 150) : null;
  if (st) { st.drive = drive; st.at = Date.now(); }
  else {
    st = { id: "s" + Date.now().toString(36), name: shortAddr(name) || ("Saved " + new Date().toLocaleDateString([], { month: "short", day: "numeric" })),
      lat: geo && geo.lat, lon: geo && geo.lon, drive, at: Date.now() };
    LIB.starts.push(st);
  }
  saveLib(); return st;
}
async function drivesFromAddress(q) {
  q = (q || "").trim(); if (!q || !pendingDrives) return;
  toast("Looking up…");
  try {
    const url = "https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=us&viewbox=-122.45,47.80,-121.85,47.45&bounded=1&q=" + encodeURIComponent(q);
    const [hit] = await (await fetch(url, { headers: { "Accept-Language": "en" } })).json();
    if (!hit) { toast("Couldn't find that address"); return; }
    const parts = hit.display_name.split(", ");
    const label = (/^\d/.test(parts[0]) && parts[1] ? parts[0] + " " + parts[1] : hit.name || parts[0]) + (parts[2] ? ", " + parts.find((x, i) => i >= 2 && /^[A-Z][a-z]/.test(x) && !/County/.test(x)) : "");
    pendingDrives(await drivesFrom(+hit.lat, +hit.lon), { lat: +hit.lat, lon: +hit.lon }, label.replace(/, undefined$/, ""));
  } catch (e) { toast("Couldn't look that up. Check your connection."); }
}
function locationHelp(kind, detail) {
  const msg = {
    denied: `<p class="note" style="margin-top:0">Your iPhone is blocking location for websites. To turn it on:</p>
      <ol class="steps-help">
        <li><b>Settings → Privacy &amp; Security → Location Services</b>: on.</li>
        <li>On the same screen, scroll to <b>Safari Websites</b> and pick <b>While Using the App</b>.</li>
        <li>If you tapped “Don’t Allow” before: <b>Settings → Apps → Safari → Location</b> → <b>Ask</b>.</li>
        <li>Close this app fully (swipe it away), open it again, tap <b>Try again</b>, then <b>Allow</b>.</li>
        <li>Still blocked? A Home Screen app remembers “Don’t Allow” on its own. Remove the Start Now icon, open the link in Safari, and Add to Home Screen again. Your saved data on the old icon will not carry over.</li>
      </ol>`,
    timeout: `<p class="note" style="margin-top:0">Finding your location took too long. Try again, ideally on Wi-Fi or near a window.</p>`,
    unavailable: `<p class="note" style="margin-top:0">Your phone couldn't work out where you are. Check that Location Services is on, then try again (Wi-Fi on helps, even if not connected).</p>`,
    typed: ""
  }[kind];
  openSheet(`
    <h2>${kind === "typed" ? "Type an address" : "Couldn't get your location"}</h2>
    ${msg}
    ${kind === "denied" || kind === "timeout" || kind === "unavailable" ? `<button class="chip on" data-act="retryLocation">Try again</button>` : ""}
    ${detail ? `<p class="note">Details: ${esc(detail)}</p>` : ""}
    ${kind === "typed" ? "" : "<h3>Or type an address</h3>"}
    <form class="search" id="addrForm">
      <input type="search" id="addr" placeholder="Street address, city" autocomplete="street-address" enterkeyhint="go">
      <button class="chip" type="submit">Use</button>
    </form>
    <p class="note">Saved only on this phone, so you can pick it again later. You can also set the minutes by hand in ⚙︎.</p>
  `);
  $("addrForm").addEventListener("submit", ev => { ev.preventDefault(); drivesFromAddress($("addr").value); });
}

/* ================= setup links =================
   ?place=Pike%20Place%20Market|47.6094,-122.3417&arrive=08:30&depart=17:30&hub=marymoor
   Applied once per phone, then remembered (so a Home Screen icon with the link keeps your later changes). */
(function applyLink() {
  const p = new URLSearchParams(location.search);
  const m = p.get("mode");
  if (m === "out" || m === "ret") T.mode = m;
  const live = {};
  for (const h of Object.keys(HUBS)) { const n = parseInt(p.get("drive_" + h), 10); if (n > 0) live[h] = n; }
  if (Object.keys(live).length) T.live = live;
  saveT();
  const keys = ["place", "arrive", "depart", "hub"];
  if (!keys.some(k => p.has(k))) return;
  const sig = keys.map(k => p.get(k) || "").join("&");
  if (S.links.includes(sig)) return;
  const pl = (p.get("place") || "").match(/^(.+)\|(-?[\d.]+),(-?[\d.]+)$/);
  if (pl) {
    const id = "link-" + pl[1].toLowerCase().replace(/[^a-z0-9]+/g, "-");
    LIB.places = LIB.places.filter(x => x.id !== id).concat([{ id, name: pl[1], short: pl[1], lat: +pl[2], lon: +pl[3] }]); saveLib();
    S.dest = id;
  }
  if (/^\d{1,2}:\d{2}$/.test(p.get("arrive") || "")) S.arriveBy = p.get("arrive").padStart(5, "0");
  if (/^\d{1,2}:\d{2}$/.test(p.get("depart") || "")) S.leaveAt = p.get("depart").padStart(5, "0");
  if (HUBS[p.get("hub")] || p.get("hub") === "auto") S.hub = p.get("hub");
  S.links.push(sig); saveS();
})();

/* ================= updates =================
   Every open (and every return to the app) asks the server which version is live; if it's newer, reload. */
async function checkForUpdate(manual) {
  if (DEV || location.protocol !== "https:") { if (manual) toast("Up to date (dev copy)"); return; }
  try {
    const j = await (await fetch("version.json?t=" + Date.now(), { cache: "no-store" })).json();
    if (j.build && j.build !== BUILD) {
      let tries = 0; try { tries = +sessionStorage.getItem("startnow.reloads") || 0; } catch (e) {}
      if (tries >= 2) return;                       // never loop if a cache is being stubborn
      try { sessionStorage.setItem("startnow.reloads", tries + 1); sessionStorage.setItem("startnow.updated", "1"); } catch (e) {}
      const reg = navigator.serviceWorker && await navigator.serviceWorker.getRegistration();
      if (reg) await reg.update().catch(() => {});
      location.reload();
    } else {
      try { sessionStorage.removeItem("startnow.reloads"); } catch (e) {}
      if (manual) toast("You have the latest version");
    }
  } catch (e) { if (manual) toast("Offline: can't check right now"); }
}

// Throw away every cached copy of the app (not your settings or saved places) and load it fresh.
async function hardReload() {
  toast("Reloading…");
  try { for (const r of (await navigator.serviceWorker?.getRegistrations?.()) || []) await r.unregister(); } catch (e) {}
  try { for (const k of await caches.keys()) await caches.delete(k); } catch (e) {}
  location.replace(location.pathname + "?fresh=" + Date.now());
}

/* ================= actions ================= */
// Drive times + where they came from -> saved starting point, used today or as the usual.
const useToday = (drive, geo, name) => {
  const st = saveStart(drive, geo, name);
  T.startId = st.id; delete T.live; saveT(); render(); sheetFrom(); toast("Starting from " + st.name);
};
const useUsual = isHome => (drive, geo, name) => {
  const st = saveStart(drive, geo, isHome ? "Home" + (name ? " · " + name : "") : name);
  S.startId = st.id; delete T.startId; saveS(); saveT(); render(); sheetSettings(FIRST_RUN); toast("Drive times saved");
};
function clearPins() { delete T.bus_out; delete T.bus_ret; }
let toastT;
function toast(msg) { const el = $("toast"); el.textContent = msg; el.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove("show"), 2200); }

document.addEventListener("click", ev => {
  if (suppressClick) return;
  const b = ev.target.closest("[data-act]"); if (!b) return;
  const a = b.dataset.act, v = b.dataset.v, dd = +b.dataset.d;
  switch (a) {
    case "close": closeSheet(); saveS(); return;
    case "map": sheetMap(); return;
    case "checkUpdate": checkForUpdate(true); return;
    case "hardReload": hardReload(); return;
    case "mode": T.mode = v; saveT(); render(); return;
    case "settings": sheetSettings(); return;
    case "to": sheetTo(); return;
    case "from": sheetFrom(); return;
    case "hub": if (v === undefined) { mode() === "out" ? sheetRoute() : sheetHub(); return; } T.hub = v === S.hub ? undefined : v; clearPins(); break;
    case "route": sheetRoute(); return;
    case "takeNext": {
      const nx = P.opts.next; if (!nx) return;
      T["bus_" + P.m] = { dep: nx.dep, route: nx.route, hub: nx.hubId, dest: eff("dest") };
      if (eff("hub") !== "auto" && eff("hub") !== nx.hubId) T.hub = nx.hubId;
      saveT(); render(); toast("Plan changed"); return;
    }
    case "driveInstead": { const [, to] = driveInsteadEnds(); if (to) openDirections(to); return; }
    case "busList": sheetBus(); return;
    case "pickRoute": T.hub = b.dataset.h; T.bus_out = { dep: +v, route: b.dataset.r, hub: b.dataset.h, dest: eff("dest") }; break;
    case "island": if (store.get("startnow.island", false)) runIsland(); else sheetIsland(); return;
    case "islandReady": store.set("startnow.island", true); closeSheet(); runIsland(); return;
    case "islandSetup": sheetIsland(); return;
    case "recalc": {
      $("recalc").classList.add("spin"); legCache.clear(); saveT();
      refreshHere(true).then(() => { render(); checkForUpdate(); toast("Recalculated " + fmt(nowMin())); if ($("sheet").classList.contains("open") && $("sheetBody").querySelector("[data-act=pickRoute]")) sheetRoute(); });
      return;
    }
    case "saveHere": if (LIB.here) { const st = saveStart(LIB.here.drive, LIB.here, LIB.here.label); toast("Saved " + st.name); sheetFrom(); } return;
    case "bus": if (v === undefined) { sheetBus(); return; }
      T["bus_" + P.m] = { dep: +v, route: b.dataset.r, hub: b.dataset.h, dest: eff("dest") }; break;
    case "dest": T.dest = v === S.dest ? undefined : v; clearPins(); saveT(); render(); sheetTo(); return;
    case "pick": {
      const x = lastResults[+v]; if (!x) return;
      const id = "p" + Date.now().toString(36);
      const near = LIB.places.find(p => dist(p, x) < 60);   // same place again? reuse it
      if (near) { T.dest = near.id; clearPins(); saveT(); render(); sheetTo(); toast("Already saved"); return; }
      LIB.places.push({ id, name: x.name, short: x.short, lat: x.lat, lon: x.lon }); saveLib();
      T.dest = id; clearPins(); saveT(); render(); sheetTo(); toast("Added " + x.short); return;
    }
    case "delPlace":
      LIB.places = LIB.places.filter(p => p.id !== v); saveLib(); delete S.walkAdj[v];
      if (S.dest === v) S.dest = DEFAULTS.dest;
      if (T.dest === v) delete T.dest;
      clearPins(); saveS(); saveT(); render(); sheetTo(); return;
    case "usualDest": S.dest = eff("dest"); delete T.dest; saveS(); saveT(); render(); sheetTo(); toast("Saved as your usual"); return;
    case "walk": { const id = P.place.id; S.walkAdj[id] = (S.walkAdj[id] || 0) + dd; legCache.clear(); saveS(); render(); sheetTo(); return; }
    case "nudge": { const k = b.dataset.k; T[k] = hmStr(hm(eff(k)) + dd); clearPins(); saveT(); render(); sheetTo(); return; }
    case "resetToday": b.dataset.k.split(",").forEach(k => delete T[k]); clearPins(); saveT(); render(); sheetTo(); return;
    case "start":
      // New starting point: forget today's park & ride / bus picks so the best route is chosen again.
      T.startId = (v || null) === (S.startId || null) ? undefined : (v || null); delete T.live; delete T.hub; clearPins();
      saveT(); render(); closeSheet(); if (eff("startId") === "here") refreshHere(); return;
    case "startHere": measureDrives(useToday); return;
    case "startTyped": pendingDrives = useToday; locationHelp("typed"); return;
    case "usualStart": S.startId = eff("startId"); delete T.startId; saveS(); saveT(); render(); sheetFrom(); toast("Saved as your usual"); return;
    case "usualStartPick": S.startId = v || null; saveS(); render(); sheetSettings(true); if (S.startId === "here") refreshHere(); return;
    case "delStart":
      LIB.starts = LIB.starts.filter(x => x.id !== v); saveLib();
      if (S.startId === v) S.startId = null;
      if (T.startId === v) delete T.startId;
      saveS(); saveT(); render(); sheetFrom(); return;
    case "retryLocation": if (pendingDrives) measureDrives(pendingDrives); return;
    case "typeAddress": pendingDrives = useUsual(false); locationHelp("typed"); return;
    case "measureHome": measureDrives(useUsual(true)); return;
    case "traffic": T.traffic = +v || undefined; saveT(); render(); sheetFrom(); return;
    case "sDrive": { const d = usualDrive(); d[b.dataset.h] = Math.max(0, d[b.dataset.h] + dd); saveS(); saveLib(); render(); sheetSettings(); return; }
    case "sPark": S.park[b.dataset.h] = Math.max(0, S.park[b.dataset.h] + dd); saveS(); render(); sheetSettings(); return;
    case "sBuffer": S.buffer = Math.max(0, S.buffer + dd); saveS(); render(); sheetSettings(); return;
    case "sCushion": S.cushion = Math.max(0, S.cushion + dd); saveS(); render(); sheetSettings(); return;
    case "startOver":
      if (!confirm("Start over? Times, stops and choices reset. Saved places and addresses stay so you can pick them again.")) return;
      store.set("startnow.settings", {}); S = loadSettings(); T = { date: todayKey() }; saveS(); saveT(); legCache.clear(); render(); sheetSettings(true); return;
    case "forgetAll":
      if (!confirm("Forget everything on this phone, including saved places and addresses? This can't be undone.")) return;
      ["startnow.settings", "startnow.today", "startnow.library"].forEach(k => { try { localStorage.removeItem(k); } catch (e) {} });
      S = loadSettings(); LIB = { places: [], starts: [], here: null }; T = { date: todayKey() }; saveS(); saveLib(); saveT(); legCache.clear(); render(); sheetSettings(true); return;
    default: return;
  }
  saveT(); render(); closeSheet();
});

/* ================= swipe down to close sheets ================= */
(function sheetDrag() {
  const sh = $("sheet"), shade = $("shade");
  let y0 = null, dy = 0, t0 = 0, dragging = false;
  const start = (y, target) => {
    if (!sh.classList.contains("open")) return;
    if (target.closest("#map, input, select, textarea, .leaflet-container")) return;   // let maps and fields work
    if (!target.closest(".grab-zone") && sh.scrollTop > 2) return;                      // mid-scroll: drag the handle
    y0 = y; dy = 0; t0 = Date.now(); dragging = false;
  };
  const move = (y, ev) => {
    if (y0 === null) return;
    dy = y - y0;
    if (!dragging) {
      if (dy > 6) { dragging = true; sh.style.transition = "none"; shade.style.transition = "none"; }
      else if (dy < -6) { y0 = null; return; }   // swiping up = normal scrolling
      else return;
    }
    if (ev.cancelable) ev.preventDefault();
    sh.style.transform = `translateY(${Math.max(0, dy)}px)`;
    shade.style.opacity = String(Math.max(0, 1 - dy / sh.offsetHeight));
  };
  const end = () => {
    if (y0 === null) return;
    const speed = dy / Math.max(1, Date.now() - t0);   // px per ms
    sh.style.transition = shade.style.transition = "";
    sh.style.transform = shade.style.opacity = "";
    if (dragging && (dy > Math.min(110, sh.offsetHeight * 0.25) || speed > 0.6)) {
      closeSheet();
      suppressClick = true; setTimeout(() => { suppressClick = false; }, 350);
    }
    y0 = null; dragging = false;
  };
  sh.addEventListener("touchstart", e => { if (e.touches.length === 1) start(e.touches[0].clientY, e.target); }, { passive: true });
  sh.addEventListener("touchmove", e => move(e.touches[0].clientY, e), { passive: false });
  sh.addEventListener("touchend", end);
  sh.addEventListener("touchcancel", end);
  // mouse (desktop): drag the handle
  sh.addEventListener("mousedown", e => { if (e.target.closest(".grab-zone")) start(e.clientY, e.target); });
  window.addEventListener("mousemove", e => move(e.clientY, e));
  window.addEventListener("mouseup", end);
})();
let suppressClick = false;

/* ================= go ================= */
(function safeAreaFallback() {
  const standalone = navigator.standalone || matchMedia("(display-mode: standalone)").matches;
  if (!standalone) return;
  const probe = document.createElement("div");
  probe.style.cssText = "position:fixed;top:0;left:0;width:1px;height:env(safe-area-inset-top,0px);visibility:hidden";
  document.body.appendChild(probe);
  const h = probe.getBoundingClientRect().height; probe.remove();
  // Phone says there's no notch but we're drawing under the status bar: leave room anyway.
  if (h < 1 && /iPhone|iPad|iPod/.test(navigator.userAgent)) document.documentElement.style.setProperty("--safe-fallback", (Math.max(screen.width, screen.height) >= 812 ? 54 : 22) + "px");
})();
render();
if (FIRST_RUN) sheetSettings(true);
setInterval(tick, 1000);
setInterval(() => { if (T.date !== todayKey()) { T = loadToday(); legCache.clear(); } render(); }, 30000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) { T = loadToday(); legCache.clear(); render(); checkForUpdate(); refreshHere(); } });
window.addEventListener("pageshow", e => { if (e.persisted) checkForUpdate(); });
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
checkForUpdate();
if (!FIRST_RUN) refreshHere();
if (/[?&]fresh=/.test(location.search)) { history.replaceState(null, "", location.pathname); setTimeout(() => toast("Reloaded the latest version"), 400); }
try { const u = sessionStorage.getItem("startnow.updated"); if (u) { sessionStorage.removeItem("startnow.updated"); setTimeout(() => toast("Updated to the latest version"), 400); } } catch (e) {}
</script>
